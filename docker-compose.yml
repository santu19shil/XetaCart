# Local PostgreSQL (OPTIONAL / DEPRECATED)
# NOTE: XetaCart now uses Supabase as its database. This docker-compose file
# is only for optional local development and is not required to run the app.
db:
  image: postgres:15-alpine
  container_name: xetacart-db
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: xetacart
  ports:
    - "5432:5432"
  volumes:
    - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
